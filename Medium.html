<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вес файла в мегабайтах — PyScript</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
  </head>
  <body>
    <h1>Вес файла в мегабайтах</h1>
    <p>
      1) Откройте этот файл в редакторе кода и впишите вес вашего файла в байтах в переменную
      <code>size_bytes</code> ниже.<br />
      2) Перетащите файл в браузер.<br />
      3) Откройте инспектор кода → консоль и скопируйте ответ.
    </p>
    <script type="py">
      size_bytes = 20

      print(f"{size_bytes / 1024 / 1024:.6f}")
    </script>
  </body>
</html>
